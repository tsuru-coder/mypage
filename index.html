<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>マイページ｜リカバリー整骨院</title>
<!-- 患者マイページ（LINE のリッチメニュー・登録用QR・受付QRから開く）
     ・ログインはメールアドレス＋パスワード。ログインした端末には「端末キー」を覚えておき、次からは入力なしで開ける
     ・はじめては、受付で渡す登録用QR（?reg=…）から登録する。受付に置いた受付QR（?in=…）を読むと、今日の予約が「来院済」になる
     ・このページ自体には患者さんのデータは入っていない（端末に残るのは端末キーだけ）
     ・設定：下の LIFF_ID と API_URL を入れる。?demo=1 を付けると、見本のデータで見た目だけ確かめられる -->
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js" charset="utf-8"></script>
<style>
  :root { --main: #0e7c70; --main-d: #075e54; --weak: #e8f5f2; --bg: #f4f6f5; --line: #e1e7e5; --sub: #6b7a76; --text: #1c2624; --warn: #b45309; --danger: #b42318; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; font-size: 15px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
  header { background: var(--main); color: #fff; padding: calc(14px + env(safe-area-inset-top)) 16px 16px; }
  header h1 { margin: 0; font-size: 18px; letter-spacing: .02em; }
  header p { margin: 2px 0 0; font-size: 12.5px; opacity: .85; }
  header { position: relative; padding-right: 92px; }
  /* 右上のメニュー（ご家族の追加など、たまにしか使わないもの） */
  #menuBtn { position: absolute; right: 12px; top: calc(14px + env(safe-area-inset-top)); border: 1.5px solid rgba(255,255,255,.6); background: none; color: #fff; font: inherit; font-size: 13px; font-weight: 700; border-radius: 99px; padding: 4px 12px; cursor: pointer; }
  #menuBg { position: fixed; inset: 0; background: rgba(0,0,0,.3); z-index: 10; }
  #menuBox { position: fixed; right: 12px; top: calc(52px + env(safe-area-inset-top)); width: 240px; background: #fff; border-radius: 14px; box-shadow: 0 8px 24px rgba(0,0,0,.18); z-index: 11; overflow: hidden; }
  #menuBox button { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: #fff; color: var(--text); font: inherit; font-size: 15px; font-weight: 600; padding: 14px 16px; cursor: pointer; }
  #menuBox button:last-child { border-bottom: 0; }
  main { padding: 14px 16px calc(28px + env(safe-area-inset-bottom)); max-width: 560px; margin: 0 auto; }
  .card { background: #fff; border-radius: 16px; padding: 16px; margin-bottom: 14px; box-shadow: 0 1px 2px rgba(0,0,0,.05); }
  .who { display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px; }
  .who b { font-size: 18px; } .who span { color: var(--sub); font-size: 13px; }
  h2 { font-size: 13px; color: var(--sub); margin: 14px 0 8px; font-weight: 700; letter-spacing: .04em; }
  h2:first-of-type { margin-top: 4px; }
  .resv { border: 1.5px solid #bfe2d9; background: var(--weak); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; }
  .resv .d { font-size: 17px; font-weight: 800; color: var(--main-d); }
  .resv .m { font-size: 13.5px; color: var(--text); margin-top: 2px; }
  .resv.first { border-color: var(--main); background: #fff; box-shadow: 0 0 0 3px var(--weak); }
  .tag { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 99px; background: var(--main); color: #fff; margin-left: 6px; vertical-align: 2px; }
  .none { color: var(--sub); font-size: 14px; background: var(--bg); border-radius: 10px; padding: 10px 12px; }
  .tk { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; }
  .tk .n { font-weight: 700; }
  .tk .r { display: flex; flex-direction: column; gap: 2px; margin-top: 4px; }
  .tk .big { font-size: 22px; font-weight: 800; color: var(--main-d); } .tk .big small { font-size: 13px; font-weight: 600; color: var(--sub); }
  .tk .ex { font-size: 12.5px; color: var(--sub); }
  .tk .ex.soon { color: var(--warn); font-weight: 700; }
  .dots { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
  .dots i { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--main); }
  .dots i.used { background: var(--main); opacity: .25; border-color: transparent; }
  .btn { display: block; width: 100%; border: 0; border-radius: 12px; padding: 13px; font: inherit; font-weight: 700; font-size: 15px; cursor: pointer; background: var(--main); color: #fff; }
  .btn.ghost { background: #fff; color: var(--main-d); border: 1.5px solid var(--main); }
  .btn.link { background: none; color: var(--sub); font-weight: 600; font-size: 13px; padding: 8px; }
  .btn:disabled { opacity: .5; }
  label { display: block; font-size: 13px; font-weight: 700; color: var(--sub); margin: 12px 0 4px; }
  input, select { width: 100%; font: inherit; font-size: 16px; padding: 11px 12px; border: 1.5px solid var(--line); border-radius: 10px; background: #fff; color: var(--text); }
  input[type=date] { -webkit-appearance: none; appearance: none; display: block; min-width: 0; max-width: 100%; min-height: 48px; text-align: left; } /* iPhoneで日付の枠がはみ出さないように */
  input:focus, select:focus { outline: none; border-color: var(--main); }
  .msg { margin-top: 10px; font-size: 13.5px; color: var(--danger); font-weight: 600; }
  .note { font-size: 12.5px; color: var(--sub); }
  .center { text-align: center; padding: 40px 0; color: var(--sub); }
  .spin { width: 28px; height: 28px; border: 3px solid var(--line); border-top-color: var(--main); border-radius: 50%; margin: 0 auto 10px; animation: sp 1s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }
  .upd { font-size: 12px; color: var(--sub); text-align: center; margin-top: 4px; }
  /* Web予約 */
  .btn.book { margin-top: 10px; }
  .resv .cx { float: right; border: 1px solid var(--line); background: #fff; color: var(--danger); font: inherit; font-size: 12px; font-weight: 700; border-radius: 99px; padding: 2px 10px; cursor: pointer; }
  .step { font-size: 13px; font-weight: 800; color: var(--main-d); margin: 4px 0 8px; }
  .step span { display: inline-block; width: 20px; height: 20px; line-height: 20px; text-align: center; border-radius: 50%; background: var(--main); color: #fff; font-size: 12px; margin-right: 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1.5px solid var(--line); background: #fff; color: var(--text); font: inherit; font-size: 14px; font-weight: 700; border-radius: 10px; padding: 8px 12px; cursor: pointer; }
  .chip.on { border-color: var(--main); background: var(--main); color: #fff; }
  .chip small { display: block; font-size: 11px; font-weight: 600; opacity: .75; }
  .days { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; -webkit-overflow-scrolling: touch; }
  .days .chip { flex: 0 0 auto; text-align: center; min-width: 64px; padding: 6px 8px; }
  .days .chip.sat { color: #1d4ed8; } .days .chip.sun { color: var(--danger); } .days .chip.on { color: #fff; }
  .times { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .times .chip { padding: 10px 0; text-align: center; }
  .sum { background: var(--weak); border-radius: 12px; padding: 12px; margin: 10px 0; }
  .sum b { font-size: 17px; color: var(--main-d); }
  .ok { text-align: center; padding: 10px 0; } .ok .ic { font-size: 40px; }
  /* メニュー選び：① 保険／自費 → ② 項目 */
  .modes { display: grid; gap: 8px; }
  .mode { text-align: left; border: 1.5px solid var(--line); background: #fff; color: var(--text); font: inherit; border-radius: 12px; padding: 11px 14px; cursor: pointer; }
  .mode b { display: block; font-size: 15px; } .mode small { display: block; font-size: 12px; color: var(--sub); }
  .mode.on { border-color: var(--main); background: var(--weak); box-shadow: 0 0 0 2px var(--main) inset; }
  .opts { display: grid; gap: 6px; margin-top: 10px; }
  .opt { display: flex; align-items: center; gap: 10px; text-align: left; border: 1.5px solid var(--line); background: #fff; color: var(--text); font: inherit; border-radius: 12px; padding: 10px 12px; cursor: pointer; }
  .opt i { flex: 0 0 22px; height: 22px; border-radius: 6px; border: 2px solid var(--line); font-style: normal; color: #fff; text-align: center; line-height: 18px; font-size: 14px; font-weight: 800; }
  .opt.on { border-color: var(--main); } .opt.on i { background: var(--main); border-color: var(--main); }
  .opt .t { flex: 1; min-width: 0; } .opt .t b { display: block; font-size: 14.5px; } .opt .t small { display: block; font-size: 12px; color: var(--sub); }
  .opt .pr { font-size: 13px; font-weight: 700; color: var(--main-d); white-space: nowrap; }
  /* ログイン・登録・受付 */
  .lnk { display: block; text-align: center; margin-top: 10px; color: var(--main-d); font-weight: 700; font-size: 13.5px; background: none; border: 0; width: 100%; cursor: pointer; font-family: inherit; }
  .ci { border: 1.5px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 10px; }
  .ci .d { font-size: 17px; font-weight: 800; } .ci .m { font-size: 13px; color: var(--sub); }
  .ci.done { border-color: var(--main); background: var(--weak); }
  .tk .big.wait { color: var(--warn); }
</style>
</head>
<body>
<header><h1>リカバリー整骨院 マイページ</h1><p>次回のご予約・回数券・フリーパスの確認と、ご予約ができます</p><button id="menuBtn" hidden>☰ メニュー</button></header>
<div id="menuBg" hidden></div>
<div id="menuBox" hidden>
  <button id="mAdd">＋ ご家族を追加する</button>
  <button id="mReload">↻ 最新の情報にする</button>
  <button id="mLogout">ログアウト</button>
  <button id="mClose" style="color:var(--sub)">閉じる</button>
</div>
<main id="app"><div class="center"><div class="spin"></div>読み込み中…</div></main>
<script>
// ===== 設定（LINE Developers・Apps Script の準備ができたら入れる） =====
const LIFF_ID = '2012229640-tcu2YFsh';   // LIFF アプリのID（例：2001234567-AbCdEfGh）
const API_URL = 'https://script.google.com/macros/s/AKfycbwfmdjExwgXjaAWHggFsubUZ9Ua3rvell-RXybxHxgRIIdeaew_pPzHLziY6EQA53tq3g/exec';   // 窓口（Apps Script のウェブアプリ）の URL（…/exec）

const app = document.getElementById('app');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const WD = ['日', '月', '火', '水', '木', '金', '土'];
const jd = d => { const x = new Date(d + 'T00:00:00'); return (x.getMonth() + 1) + '月' + x.getDate() + '日（' + WD[x.getDay()] + '）'; };
const ymdLocal = x => x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0'); // 日本時間の日付
const daysTo = d => Math.round((new Date(d + 'T00:00:00') - new Date(new Date().toDateString())) / 86400000);
const demo = new URLSearchParams(location.search).get('demo') === '1';
let state = { patients: [] };
let pend = null; // QRから開いたとき：{ reg: 登録用QRの番号 } か { in: 受付QRの番号 }

// 端末キー：この端末でログインしたしるし（パスワードは覚えない）。保存できない端末では、開いている間だけ覚える
const TOKEN_KEY = demo ? 'mp_token_demo' : 'mp_token';
let memToken = '';
const getToken = () => { try { return localStorage.getItem(TOKEN_KEY) || memToken; } catch (e) { return memToken; } };
const setToken = t => { memToken = t || ''; try { if (t) localStorage.setItem(TOKEN_KEY, t); else localStorage.removeItem(TOKEN_KEY); } catch (e) { /* 保存できない端末 */ } };

/** 窓口を呼ぶ（端末キーをつけて）。ログインが必要なときは e.login = true */
async function call(action, extra) {
  if (demo) return demoCall(action, extra);
  const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ action: action, token: getToken() }, extra || {})) });
  const j = await res.json();
  if (!j.ok) { const e = new Error(j.error || 'うまく読み込めませんでした'); e.login = !!j.login; throw e; }
  return j.data;
}
const loading = t => { app.innerHTML = '<div class="center"><div class="spin"></div>' + esc(t || '読み込み中…') + '</div>'; };
const $ = id => document.getElementById(id);
/** ボタンを押したら：止めて「…中」にし、終わったら戻す。エラーは msg に出す */
async function busy(btn, label, fn) {
  const t = btn.textContent, msg = $('fMsg');
  btn.disabled = true; btn.textContent = label; if (msg) msg.textContent = '';
  try { await fn(); } catch (e) { if (msg) msg.textContent = e.message; else alert(e.message); if (document.body.contains(btn)) { btn.disabled = false; btn.textContent = t; } }
}

/** 右上のメニュー：マイページを表示しているときだけ出す */
function showMenuBtn(on) { document.getElementById('menuBtn').hidden = !on; openMenu(false); }
function openMenu(on) { document.getElementById('menuBg').hidden = !on; document.getElementById('menuBox').hidden = !on; }
document.getElementById('menuBtn').onclick = () => openMenu(true);
document.getElementById('menuBg').onclick = () => openMenu(false);
document.getElementById('mClose').onclick = () => openMenu(false);
document.getElementById('mAdd').onclick = () => { openMenu(false); alert('ご家族の追加は、受付でお渡しする「マイページ登録用QRコード」を、この端末で読み取ってください。\n（ログインしたまま読み取ると、このマイページに追加されます）'); };
document.getElementById('mReload').onclick = () => location.reload();
document.getElementById('mLogout').onclick = async () => {
  openMenu(false);
  if (!confirm('この端末からログアウトしますか？\n（次に開くときは、メールアドレスとパスワードを入れます）')) return;
  try { await call('logout'); } catch (e) { /* すでに切れていてもよい */ }
  setToken(''); state = { patients: [] }; renderLogin();
};

function render() {
  if (!state.patients.length) return renderEmpty();
  showMenuBtn(true);
  app.innerHTML = state.patients.map(p => {
    const next = p.next.length ? p.next.map((r, i) => '<div class="resv' + (i === 0 ? ' first' : '') + '">' + (r.canCancel ? '<button class="cx" data-cx="' + esc(r.id) + '" data-pid="' + esc(p.id) + '" data-when="' + esc(jd(r.date) + ' ' + r.start) + '">キャンセル</button>' : '') + '<div class="d">' + jd(r.date) + ' ' + esc(r.start) + '〜' + (i === 0 && daysTo(r.date) <= 1 ? '<span class="tag">' + (daysTo(r.date) === 0 ? '今日' : '明日') + '</span>' : '') + '</div><div class="m">' + esc(r.menus.join('・')) + '</div></div>').join('')
      : '<div class="none">次回のご予約はありません</div>';
    const tks = p.tickets.length ? p.tickets.map(t => {
      const soon = t.expires && daysTo(t.expires) <= 14;
      const ex = t.expires ? '有効期限 ' + jd(t.expires) + (soon ? '（あと' + Math.max(0, daysTo(t.expires)) + '日）' : '') : '有効期限なし';
      const wait = t.starts && t.starts > ymdLocal(new Date()); // 期間が決まったパスで、まだ始まっていない
      if (t.type === 'フリーパス') return '<div class="tk"><div class="n">' + esc(t.name) + '</div><div class="r"><span class="big' + (wait ? ' wait' : '') + '">' + (wait ? '開始前' : 'ご利用中') + '</span><span class="ex">' + (wait ? jd(t.starts) + 'から使えます' : '') + '</span><span class="ex' + (soon ? ' soon' : '') + '">' + ex + '</span></div></div>';
      const dots = t.total && t.total <= 20 ? '<div class="dots">' + Array.from({ length: t.total }, (_, k) => '<i class="' + (k < t.total - t.remain ? 'used' : '') + '"></i>').join('') + '</div>' : '';
      return '<div class="tk"><div class="n">' + esc(t.name) + '</div><div class="r"><span class="big">残り ' + t.remain + '<small> 回' + (t.total ? '（全' + t.total + '回）' : '') + '</small></span><span class="ex' + (soon ? ' soon' : '') + '">' + ex + '</span></div>' + dots + '</div>';
    }).join('') : '<div class="none">ご利用中の回数券・フリーパスはありません</div>';
    const book = p.book && p.book.ok ? '<button class="btn book" data-book="' + esc(p.id) + '">＋ 次回のご予約をとる</button>' : '<p class="note" style="margin:8px 0 0">' + esc((p.book && p.book.reason) || '次回のご予約は、受付またはお電話でお願いします') + '</p>';
    return '<div class="card"><div class="who"><b>' + esc(p.name) + ' 様</b><span>' + esc(p.clinic) + '</span></div><h2>次回のご予約</h2>' + next + book + '<h2>回数券・フリーパス</h2>' + tks +
      '<button class="btn link" data-un="' + esc(p.id) + '">この方の表示をやめる</button></div>';
  }).join('') +
    '<p class="upd">' + (state.patients.some(p => p.next.some(r => r.canCancel)) ? '当日のキャンセル・ご予約の変更は、お電話でご連絡ください' : 'ご予約の変更・キャンセルは、お電話でご連絡ください') + '</p>';
  app.querySelectorAll('[data-book]').forEach(b => b.onclick = () => startBook(b.dataset.book));
  app.querySelectorAll('[data-cx]').forEach(b => b.onclick = async () => {
    if (!confirm(b.dataset.when + ' のご予約をキャンセルしますか？')) return;
    b.disabled = true; b.textContent = 'キャンセル中…';
    try { state = await call('cancel', { patientId: b.dataset.pid, reservationId: b.dataset.cx }); render(); alert('キャンセルしました'); } catch (e) { alert(e.message); b.disabled = false; b.textContent = 'キャンセル'; }
  });
  app.querySelectorAll('[data-un]').forEach(b => b.onclick = async () => {
    if (!confirm('この方の表示をやめますか？（もう一度見るときは、受付で新しい登録用QRコードをお受け取りください）')) return;
    b.disabled = true;
    try { state = await call('unlink', { patientId: b.dataset.un }); render(); } catch (e) { alert(e.message); b.disabled = false; }
  });
}

// ===== Web予約（メニュー → 日にち → 時間 → 確認） =====
// 先生の名前は出さない。窓口が「予約できる時間」だけを返す
let bk = null;
async function startBook(pid) {
  const p = state.patients.filter(x => x.id === pid)[0];
  app.innerHTML = '<div class="center"><div class="spin"></div>読み込み中…</div>';
  try {
    const info = await call('book_info', { patientId: pid });
    if (!info.ok) { alert(info.reason); return render(); }
    // 前回と同じ（prev）があれば、はじめはそれ。なければ ①保険／自費 から選ぶ
    bk = { pid: pid, name: p ? p.name : '', info: info, mode: info.prev ? info.prev.mode : '', keys: info.prev ? info.prev.keys.slice() : [], change: !info.prev, date: '', times: null, time: '', msg: '', loading: false };
    renderBook();
  } catch (e) { alert(e.message); render(); }
}
const itemOf = k => bk.info.items.filter(x => x.key === k)[0] || { key: k, label: k };
const labels = () => bk.keys.map(k => itemOf(k).label).join('・');
const yen = n => '¥' + Number(n).toLocaleString();
const MODES = [['ins', 'いつも保険証を提示している方', '保険診療と、一緒に受ける施術（保険併用）をご案内します'], ['self', '自費で施術を受けている方', '自費のメニューをご案内します']];
const sd = d => { const x = new Date(d + 'T00:00:00'); return { md: (x.getMonth() + 1) + '/' + x.getDate(), w: WD[x.getDay()], cls: x.getDay() === 6 ? ' sat' : x.getDay() === 0 ? ' sun' : '' }; };
function renderBook() {
  showMenuBtn(false);
  const I = bk.info;
  // ① 保険／自費 → ② 項目（自費のメニューだけ料金を出す）
  const opts = bk.mode ? '<div class="opts">' + I.items.filter(x => x[bk.mode]).map(x => {
    const on = bk.keys.indexOf(x.key) >= 0, pr = x[bk.mode].price;
    return '<button class="opt' + (on ? ' on' : '') + '" data-k="' + esc(x.key) + '"><i>' + (on ? '✓' : '') + '</i><span class="t"><b>' + esc(x.label) + '</b>' + (x.note ? '<small>' + esc(x.note) + '</small>' : '') + '</span>' + (pr != null ? '<span class="pr">' + yen(pr) + '</span>' : '') + '</button>';
  }).join('') + '</div>' + (bk.mode === 'ins' ? '<p class="note" style="margin:8px 0 0">※ 保険の料金は、負担割合や通院の回数によって変わります。自費の料金は保険の分とは別です。</p>' : '') : '';
  const menus = bk.change
    ? '<div class="modes">' + MODES.map(m => '<button class="mode' + (bk.mode === m[0] ? ' on' : '') + '" data-mode="' + m[0] + '"><b>' + m[1] + '</b><small>' + m[2] + '</small></button>').join('') + '</div>' + opts + (I.prev ? '<button class="btn link" id="mBack">前回と同じにもどす</button>' : '')
    : '<div class="sum" style="margin:0"><b style="font-size:15px">' + esc(labels()) + '</b><div class="note">前回と同じメニュー</div></div><button class="btn link" id="mChg">メニューを変更する</button>';
  const days = '<div class="days">' + I.dates.map(d => { const x = sd(d); return '<button class="chip' + x.cls + (bk.date === d ? ' on' : '') + '" data-d="' + d + '">' + x.md + '<small>' + x.w + '</small></button>'; }).join('') + '</div>';
  const times = !bk.date ? '<p class="note">日にちを選ぶと、予約できる時間が出ます</p>'
    : bk.loading ? '<div class="center" style="padding:14px 0"><div class="spin"></div>空き時間を探しています…</div>'
    : bk.times && bk.times.length ? '<div class="times">' + bk.times.map(t => '<button class="chip' + (bk.time === t ? ' on' : '') + '" data-t="' + t + '">' + t + '</button>').join('') + '</div>'
    : '<div class="none">' + esc(bk.msg || 'この日は空きがありません') + '</div>';
  const ready = bk.keys.length && bk.date && bk.time;
  app.innerHTML = '<div class="card"><div class="who"><b>ご予約</b><span>' + esc(bk.name) + ' 様</span></div>' +
    '<div class="step"><span>1</span>メニュー</div>' + menus +
    '<div class="step" style="margin-top:16px"><span>2</span>日にち</div>' + days +
    '<div class="step" style="margin-top:14px"><span>3</span>時間</div>' + times +
    (ready ? '<div class="sum"><b>' + jd(bk.date) + ' ' + esc(bk.time) + '〜</b><div>' + esc(labels()) + '</div></div>' : '') +
    '<div class="msg" id="bMsg"></div><div style="margin-top:12px"><button class="btn" id="bGo"' + (ready ? '' : ' disabled') + '>この内容で予約する</button></div>' +
    '<button class="btn link" id="bBack">やめる</button>' +
    '<p class="note">' + (I.cancel === '前日まで' ? 'キャンセルは前日まで、このページからできます。当日はお電話でお願いします。' : 'キャンセル・変更はお電話でお願いします。') + '</p></div>';
  const $ = id => document.getElementById(id);
  if ($('mChg')) $('mChg').onclick = () => { bk.change = true; renderBook(); };
  if ($('mBack')) $('mBack').onclick = () => { bk.change = false; bk.mode = I.prev.mode; bk.keys = I.prev.keys.slice(); resetTimes(); };
  // 保険／自費を選んだら、選べない項目は外す。保険なら「保険診療」をはじめから選んでおく
  app.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => {
    if (bk.mode === b.dataset.mode) return;
    bk.mode = b.dataset.mode;
    bk.keys = bk.keys.filter(k => itemOf(k)[bk.mode]);
    if (bk.mode === 'ins' && bk.keys.indexOf('INS') < 0 && I.items.some(x => x.key === 'INS')) bk.keys.unshift('INS');
    resetTimes();
  });
  app.querySelectorAll('[data-k]').forEach(b => b.onclick = () => {
    const i = bk.keys.indexOf(b.dataset.k);
    if (i >= 0) bk.keys.splice(i, 1); else bk.keys.push(b.dataset.k);
    resetTimes();
  });
  app.querySelectorAll('[data-d]').forEach(b => b.onclick = () => { bk.date = b.dataset.d; resetTimes(); });

    const b = $('bGo');

    try {
      const r = await call('book', { patientId: bk.pid, date: bk.date, time: bk.time, choice: { mode: bk.mode, keys: bk.keys } });

    } catch (e) {
      $('bMsg').textContent = e.message; b.disabled = false; b.textContent = 'この内容で予約する';
      if (/埋まり/.test(e.message)) { bk.time = ''; loadTimes(); } // 埋まったときは時間を出しなおす
    }

}
/** メニューか日にちを変えたら、時間を出しなおす */
function resetTimes() { bk.time = ''; bk.times = null; if (bk.date && bk.keys.length) loadTimes(); else renderBook(); }
async function loadTimes() {
  const key = bk.date + '|' + bk.mode + '|' + bk.keys.join();
  bk.loading = true; renderBook();
  try {
    const r = await call('book_times', { patientId: bk.pid, date: bk.date, choice: { mode: bk.mode, keys: bk.keys } });
    if (!bk || bk.date + '|' + bk.mode + '|' + bk.keys.join() !== key) return; // 待っている間に選びなおした
    bk.times = r.times; bk.msg = r.message;
  } catch (e) { if (bk) { bk.times = []; bk.msg = e.message; } }
  if (bk) { bk.loading = false; renderBook(); }
}

/** QRから開いたとき：URLの ?reg= / ?in= を読み、URLからは消す（読み込みなおしで同じことが起きないように） */
function readParams() {
  const q = new URLSearchParams(location.search);
  const st = q.get('liff.state'); // LINE の中で開いたとき、まだ移しかえられていない場合
  const p = st ? new URLSearchParams(st.replace(/^[^?]*\?/, '')) : q;
  const reg = p.get('reg') || q.get('reg'), inn = p.get('in') || q.get('in');
  if (reg) pend = { reg: reg }; else if (inn) pend = { in: inn };
  if (reg || inn) try { history.replaceState(null, '', location.pathname + (demo ? '?demo=1' : '')); } catch (e) { /* そのままでよい */ }
}

let inited = false;
async function start() {
  loading();
  try {
    if (!demo && !inited) {
      if (!LIFF_ID || !API_URL) throw new Error('このページの設定がまだです（LIFF_ID・API_URL）');
      try { await liff.init({ liffId: LIFF_ID }); } catch (e) { /* LINE の外で開いたときも、そのまま使えるように */ }
    }
    if (!inited) { readParams(); inited = true; }
    if (!getToken()) return pend && pend.reg ? regEntry() : renderLogin();
    if (pend && pend.in) return checkin();
    state = await call('me');
    afterLogin();
  } catch (e) {
    if (e.login) { setToken(''); return pend && pend.reg ? regEntry() : renderLogin(e.message === 'ログインしてください' ? '' : e.message); }
    app.innerHTML = '<div class="card"><b>開けませんでした</b><p class="note">' + esc(e.message) + '</p><button class="btn" onclick="location.reload()">もう一度読み込む</button></div>';
  }
}

      { key: 'M:M21', label: '福岡市鍼', note: '福岡市の鍼灸助成です（受領証が必要です）', ins: { price: null }, self: { price: null } }, { key: 'M:M30', label: 'マトリックス', note: '', ins: { price: 1100 }, self: { price: 1100 } },
      { key: 'G:ヘッドスパ', label: 'ヘッドスパ', note: '', ins: { price: 4400 }, self: { price: 4400 } }] });
  if (action === 'book_times') return wait(new Date(extra.date + 'T00:00:00').getDay() === 3 ? { times: [], message: 'この日は空きがありません。ほかの日をお選びください' } : { times: ['9:30', '10:00', '11:30', '15:00', '15:30', '16:00', '18:30', '19:00'], message: '' });
  if (action === 'book') return wait({ booked: { date: extra.date, time: extra.time, menus: extra.choice.keys.map(k => k === 'INS' ? '保険診療（基本施術）' : k === 'HARI' ? '保険鍼灸' : k.replace(/^G:|^M:/, '')) }, page: page() });
  if (action === 'unlink') return wait({ patients: [] });
  return wait(page()); // me・add・cancel
}
start();
</script>
